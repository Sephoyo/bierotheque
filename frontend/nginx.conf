server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA Angular : toute route inconnue retombe sur index.html (routing géré
    # côté client par le router Angular).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js est régénéré à chaque démarrage de conteneur (voir
    # docker-entrypoint.sh) : ne jamais le mettre en cache.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
