server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /admin sert le même index.html que le reste (SPA), mais ne doit jamais
    # être indexé par les moteurs de recherche : robots.txt en dissuade déjà
    # le crawl, ce header le garantit même si l'URL est atteinte autrement
    # (lien externe, etc.) — plus robuste qu'une balise <meta robots> seule,
    # qui dépend de l'exécution JS par le crawler.
    #
    # Piège nginx : try_files vers /index.html fait une redirection interne
    # qui re-matche les location depuis zéro et perdrait le header s'il
    # tombait sur le bloc "location /" générique — on route donc le fallback
    # vers une location nommée dédiée qui redéclare le header (vérifié en
    # local : sans ça, X-Robots-Tag était bien présent sur la 1ère requête
    # mais absent une fois le fallback appliqué).
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ @admin_fallback;
    }

    location @admin_fallback {
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /index.html break;
    }

    # SPA Angular : toute route inconnue retombe sur index.html (routing géré
    # côté client par le router Angular).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js est régénéré à chaque démarrage de conteneur (voir
    # docker-entrypoint.sh) : ne jamais le mettre en cache.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
