security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un seul compte admin en mémoire (pas besoin d'une table utilisateur pour
    # un unique compte perso) — identifiants lus depuis l'env, hash généré via
    # `php bin/console security:hash-password`.
    #
    # ADMIN_PASSWORD_HASH est stocké en base64 (processeur d'env Symfony
    # "base64:") et non en clair : un hash bcrypt contient des `$` que
    # l'interpolation de variables de Dokploy/Docker Compose traite comme des
    # débuts de référence de variable (`$xxx` → substitution → vide si non
    # défini), corrompant silencieusement le hash sur au moins deux niveaux
    # d'échappement différents (cf. CLAUDE.md, 2026-08-11). Le base64 ne
    # contient aucun `$`, donc plus aucun risque d'interpolation parasite.
    providers:
        admin_provider:
            memory:
                users:
                    '%env(ADMIN_USERNAME)%':
                        password: '%env(base64:ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Doit être déclaré AVANT "api" : seule la première règle qui matche
        # s'applique (même principe que l'ordre des paths dans nelmio_cors.yaml).
        admin:
            pattern: ^/api/(breweries/pending|breweries/edit-suggestions|contact/messages|analytics/stats)
            stateless: true
            http_basic:
                realm: 'Bièrothèque Admin'
            provider: admin_provider
        api:
            pattern: ^/api
            stateless: true
            security: false
        main:
            stateless: true
            security: false

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/(breweries/pending|breweries/edit-suggestions|contact/messages|analytics/stats), roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
